<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Manager Webapp</title>
</head>
<body>
    <h1>Book Manager Webapp</h1>
    <p>
        <a href="/">Home</a> |
        <a href="/view-all">View all books</a> |
        <a href="/add-new">Add a book</a>
    </p>
    
    <hr>

    <h3>List of all books</h3>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author/s</th>
                <th>Price (INR)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for b in books %}
            <tr>
                <td>{{b["id"]}}</td>
                <td>{{b["title"]}}</td>
                <td>{{b["author"]}}</td>
                <td>{{b["price"]}}</td>
                <td>
                    <a href="/delete-book?id={{b['id']}}">Delete</a>
                </td>
            </tr>
            {% endfor %}

        </tbody>
    </table>
    
</body>
</html>
